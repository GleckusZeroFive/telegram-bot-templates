[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"
markers = [
    "db: needs PostgreSQL with migrations applied (TEST_DATABASE_URL)",
]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = [
    "E", "W", "F",   # pycodestyle, pyflakes
    "I",             # isort
    "UP",            # pyupgrade
    "B",             # bugbear
    "ASYNC",         # blocking calls inside async code
    "S",             # bandit (security)
    "SIM",           # simplifications
    "RUF",
]
ignore = [
    # Russian text in strings, comments and docstrings is intentional
    "RUF001", "RUF002", "RUF003",
    # Sync pathlib/open calls in handlers touch small local temp files (mkdir, exists,
    # unlink); moving each into a thread adds noise without a measurable effect.
    # Heavy blocking work (parsing, OCR, embeddings, Qdrant) runs via asyncio.to_thread.
    "ASYNC230", "ASYNC240",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S311"]
