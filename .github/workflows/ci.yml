name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install ruff==0.16.2
      - run: ruff check .

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ragbot
          POSTGRES_PASSWORD: ragbot_test
          POSTGRES_DB: ragbot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ragbot -d ragbot_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ragbot_test
      POSTGRES_USER: ragbot
      POSTGRES_PASSWORD: ragbot_test
      TEST_DATABASE_URL: postgresql+asyncpg://ragbot:ragbot_test@localhost:5432/ragbot_test
      # Tests that need the ~2 GB embedding model skip instead of downloading it
      HF_HUB_OFFLINE: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install dependencies
        run: |
          pip install torch==2.5.1+cpu --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-dev.txt
      - name: Apply migrations
        run: alembic upgrade head
      - name: Run tests
        run: pytest -q -rs
